<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>새싹나라유치원 포토부스</title>
<meta property="og:type" content="website">
<meta property="og:title" content="새싹나라유치원 포토부스 📸">
<meta property="og:description" content="터치 한 번으로 네컷사진 찍고 QR로 바로 받아가세요!">
<meta property="og:image" content="https://edupoplab.github.io/20_photo/thumbnail.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#EAF6E9;
    --green:#4CAF50;
    --green-dark:#2E4A2E;
    --white:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{
    margin:0;height:100%;overflow:hidden;background:#000;
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  .screen{
    position:fixed;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;
    background:var(--mint);
  }
  .screen.active{display:flex}

  /* ---- 시작 화면 ---- */
  #screen-start{background:linear-gradient(135deg,#FFF6DE,#F5FBEF 55%,#E3F5E3);overflow:hidden}
  .start-deco{position:absolute;inset:0;pointer-events:none;z-index:0}
  .start-deco span{position:absolute;font-size:clamp(22px,4vw,38px);opacity:.5;animation:floaty 6s ease-in-out infinite}
  .start-deco span:nth-child(2n){animation-duration:7.5s;animation-delay:.4s}
  .start-deco span:nth-child(3n){animation-duration:5.2s;animation-delay:.8s}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

  #screen-start img.logo{width:min(26vw,150px);margin-bottom:14px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.15));position:relative;z-index:1}
  .start-ribbon{
    position:relative;z-index:1;background:linear-gradient(90deg,#FF8A65,#F48FB1);
    color:#fff;font-weight:800;font-size:clamp(16px,2.4vw,24px);
    padding:12px 34px;border-radius:100px;box-shadow:0 8px 20px rgba(0,0,0,.18);
    margin-bottom:10px;text-align:center;
  }
  .start-sub{position:relative;z-index:1;color:#4a6b4a;font-size:clamp(14px,2vw,18px);margin:0 0 26px;font-weight:700}

  .template-grid{position:relative;z-index:1;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:0 20px;max-width:760px}
  .template-card{
    border:none;border-radius:26px;padding:24px 20px;width:min(28vw,200px);
    display:flex;flex-direction:column;align-items:center;gap:8px;
    color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.18);
  }
  .template-card:active{transform:scale(.96)}
  .tpl-emoji{font-size:clamp(28px,4.2vw,42px)}
  .tpl-label{font-size:clamp(14px,1.9vw,18px)}
  .tpl-desc{font-size:clamp(11px,1.4vw,13px);font-weight:600;opacity:.9}
  .tpl-anniversary{background:linear-gradient(160deg,#FF8A65,#F48FB1)}
  .tpl-doodle{background:linear-gradient(160deg,#42A5F5,#7E57C2)}
  .tpl-daily{background:linear-gradient(160deg,#66BB6A,#26C6DA)}

  /* ---- 문구 입력 화면 (데일리) ---- */
  #screen-caption{background:linear-gradient(135deg,#E3F6FF,#F3F0FF 55%,#E8FBF3)}
  .caption-card{
    background:#fff;border-radius:28px;padding:34px 28px;max-width:520px;width:88vw;
    box-shadow:0 14px 40px rgba(0,0,0,.15);text-align:center;
  }
  .caption-card h2{color:#2E4A2E;font-size:clamp(18px,2.6vw,24px);margin:10px 0 4px}
  .caption-card p{color:#6a7a6a;font-size:14px;margin:0 0 20px}
  #captionInput{
    width:100%;padding:16px 18px;font-size:18px;border-radius:16px;
    border:2px solid #cfe0ff;text-align:center;margin-bottom:24px;font-family:inherit;
  }
  #captionInput:focus{outline:none;border-color:#4FC3F7}
  .caption-btns{display:flex;gap:12px;justify-content:center}
  .btn-ghost{background:#eee;color:#555;border:none;border-radius:100px;padding:16px 26px;font-size:16px;font-weight:700}
  .btn-daily{
    background:linear-gradient(90deg,#66BB6A,#26C6DA);color:#fff;border:none;
    border-radius:100px;padding:16px 32px;font-size:16px;font-weight:800;
    box-shadow:0 8px 20px rgba(38,198,196,.35);
  }

  /* ---- 촬영 화면 ---- */
  #screen-camera{background:#000}
  #camVideo{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transform:scaleX(-1);
  }
  .cam-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px;pointer-events:none}
  .shot-counter{
    align-self:flex-start;background:rgba(0,0,0,.45);color:#fff;
    padding:10px 20px;border-radius:100px;font-size:18px;font-weight:700;
  }
  .countdown-num{
    font-size:min(40vw,320px);font-weight:900;color:#fff;
    text-shadow:0 8px 30px rgba(0,0,0,.5);line-height:1;
  }
  .cam-hint{color:#fff;font-size:20px;background:rgba(0,0,0,.4);padding:10px 22px;border-radius:100px;margin-bottom:8px}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #flash.on{opacity:1;transition:opacity .08s ease-out}
  #flash.off{opacity:0;transition:opacity .4s ease-in}
  #cancelBtn{
    position:absolute;top:20px;right:20px;pointer-events:auto;z-index:6;
    background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:100px;
    padding:12px 22px;font-size:16px;
  }
  #flipBtn{
    position:absolute;top:20px;left:20px;pointer-events:auto;z-index:6;
    background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:100px;
    padding:12px 16px;font-size:18px;
  }
  #camError{
    position:absolute;left:50%;bottom:60px;transform:translateX(-50%);
    background:rgba(178,59,59,.92);color:#fff;padding:16px 26px;border-radius:16px;
    font-size:18px;font-weight:700;text-align:center;max-width:80vw;
  }
  #readyOverlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.55);z-index:5;
  }
  .ready-card{
    background:#fff;border-radius:24px;padding:36px 32px;text-align:center;max-width:80vw;
    box-shadow:0 14px 40px rgba(0,0,0,.3);
  }
  .ready-card p{font-size:clamp(18px,2.6vw,24px);color:#2E4A2E;font-weight:700;margin:0 0 22px;line-height:1.5}
  #readyStartBtn{
    background:linear-gradient(90deg,#FF8A65,#F48FB1);color:#fff;border:none;
    border-radius:100px;padding:18px 46px;font-size:20px;font-weight:800;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
  }

  /* ---- 처리 중 ---- */
  #screen-processing p{color:var(--green-dark);font-size:22px;margin-top:24px;font-weight:700}
  .spinner{width:64px;height:64px;border:8px solid #cfe8cf;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- 결과 화면 ---- */
  #screen-result h2{color:var(--green-dark);font-size:clamp(18px,2.6vw,26px);margin:0 0 14px;text-align:center}
  #stripPreview{max-height:32vh;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);margin-bottom:16px}
  .local-save-row{display:flex;gap:12px;margin-bottom:18px}
  .btn-save{
    background:#fff;color:#2E4A2E;border:2px solid #4CAF50;border-radius:100px;
    padding:12px 22px;font-size:15px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.1);
  }
  .save-divider{color:#7a9a7a;font-size:13px;font-weight:700;margin-bottom:12px}
  #qrBox{background:#fff;padding:16px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.15);margin-bottom:10px}
  #qrBox img{display:block;width:min(38vw,200px);height:auto}
  #screen-result .scan-hint{color:#3a5a3a;font-size:clamp(14px,2vw,18px);font-weight:700;margin-bottom:24px}
  #resetBtn{background:var(--green);color:#fff;border:none;border-radius:100px;font-size:18px;font-weight:700;padding:16px 44px}
  #errBox{color:#b23b3b;font-size:16px;margin-top:14px;text-align:center}

  .hidden{display:none !important}
</style>
</head>

  function formatToday(){
    var d = new Date();
    var mm = String(d.getMonth() + 1).padStart(2, "0");

  async function startCamera(){
    var constraints = {
      audio: false,
      video: { facingMode: state.facingMode, width: { ideal: 1280 }, height: { ideal: 960 } }
    };
    state.stream = await navigator.mediaDevices.getUserMedia(constraints);
    els.camVideo.srcObject = state.stream;
    await new Promise(function(resolve){ els.camVideo.onloadedmetadata = resolve; });
  }

  function stopCamera(){
    if (state.stream){
      state.stream.getTracks().forEach(function(t){ t.stop(); });
      state.stream = null;
    }
  }

  function pickMimeType(){
    // mp4(h264)를 우선 시도 - 아이폰에서도 바로 재생/저장되도록. 태블릿이 지원 안 하면 webm으로 자동 폴백
    var candidates = [
      "video/mp4;codecs=h264,aac", "video/mp4;codecs=avc1", "video/mp4",
      "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"
    ];
    for (var i=0;i<candidates.length;i++){
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
    }
    return "";
  }

  function startRecording(){
    state.recordedChunks = [];
    var mime = pickMimeType();
    var opts = { videoBitsPerSecond: 1200000 };
    if (mime) opts.mimeType = mime;
    try {
      state.recorder = new MediaRecorder(state.stream, opts);
    } catch(err){
      state.recorder = null;
      return;
    }
    state.recorder.ondataavailable = function(e){ if (e.data && e.data.size > 0) state.recordedChunks.push(e.data); };
    state.recorder.start();
  }

  function stopRecording(){
    return new Promise(function(resolve){
      if (!state.recorder || state.recorder.state === "inactive"){ resolve(null); return; }
      state.recorder.onstop = function(){
        var blob = new Blob(state.recordedChunks, { type: state.recorder.mimeType || "video/webm" });
        resolve(blob);
      };
      state.recorder.stop();
    });
  }

  // video 엘리먼트의 현재 프레임을 (미러 적용) cellW x cellH 캔버스로 크롭해서 반환
  function captureCellFromVideo(){
    var v = els.camVideo;
    var vw = v.videoWidth, vh = v.videoHeight;
    var targetRatio = CELL_W / CELL_H;
    var srcRatio = vw / vh;
    var sx, sy, sw, sh;
    if (srcRatio > targetRatio){
      sh = vh; sw = vh * targetRatio; sy = 0; sx = (vw - sw) / 2;
    } else {
      sw = vw; sh = vw / targetRatio; sx = 0; sy = (vh - sh) / 2;
    }
    var c = document.createElement("canvas");
    c.width = CELL_W; c.height = CELL_H;
    var ctx = c.getContext("2d");
    ctx.save();
    ctx.translate(CELL_W, 0);
    ctx.scale(-1, 1); // 프리뷰와 동일하게 좌우 반전해서 저장
    ctx.drawImage(v, sx, sy, sw, sh, 0, 0, CELL_W, CELL_H);
    ctx.restore();
    return c;
  }

  // video/canvas 등 어떤 소스든 dx,dy,dw,dh 영역에 (미러 적용, cover 크롭) 그려주는 공용 헬퍼
  // - 무빙 네컷 합성 시 각 칸에 재생 중인 영상을 그릴 때 사용
  function drawMirroredCover(ctx, source, sourceW, sourceH, dx, dy, dw, dh){
    if (!sourceW || !sourceH) return;
    var targetRatio = dw / dh;
    var srcRatio = sourceW / sourceH;
    var sx, sy, sw, sh;
    if (srcRatio > targetRatio){
      sh = sourceH; sw = sourceH * targetRatio; sy = 0; sx = (sourceW - sw) / 2;
    } else {
      sw = sourceW; sh = sourceW / targetRatio; sx = 0; sy = (sourceH - sh) / 2;
    }
    ctx.save();
    ctx.translate(dx + dw, dy);
    ctx.scale(-1, 1);
    ctx.drawImage(source, sx, sy, sw, sh, 0, 0, dw, dh);
    ctx.restore();
  }

  async function runCountdown(n){
    for (var i = n; i >= 1; i--){
      if (state.cancelled) return;
      els.countdownNum.textContent = i;
      await sleep(1000);
    }
    els.countdownNum.textContent = "";
  }

  async function flashEffect(){
    els.flash.classList.remove("off");
    els.flash.classList.add("on");
    await sleep(90);
    els.flash.classList.remove("on");
    els.flash.classList.add("off");
  }

  // 인생네컷처럼 각 프레임 안에서 그 순간이 움직이도록, 한 통짜리 영상 대신
  // 샷마다 짧은 영상을 따로 녹화해둠 (나중에 buildMovingStrip에서 4칸에 각각 재생하며 합성)
  async function runShootingSequence(){
    state.frames = [];
    state.shotClips = [];
    state.cancelled = false;
    els.camHint.textContent = "준비하세요!";

    for (var i = 0; i < SHOT_COUNT; i++){
      if (state.cancelled) return;
      els.shotCounter.textContent = (i+1) + " / " + SHOT_COUNT;
      els.camHint.textContent = i === 0 ? "웃어주세요~" : "다시 한번!";
      startRecording();
      await runCountdown(COUNTDOWN_SECONDS);
      if (state.cancelled) { await stopRecording(); return; }
      await flashEffect();
      state.frames.push(captureCellFromVideo());
      await sleep(GAP_BETWEEN_SHOTS_MS);
      var clip = await stopRecording();
      if (clip) state.shotClips.push(clip);
    }

    els.camHint.textContent = "완료!";
    await sleep(300);
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function truncateText(ctx, text, maxWidth){
    if (ctx.measureText(text).width <= maxWidth) return text;
    while (text.length > 1 && ctx.measureText(text + "…").width > maxWidth){ text = text.slice(0, -1); }
    return text + "…";
  }

  // ===================== 컴포지트: 공통 (20주년 / 데일리) =====================

  function drawFestiveBackground(ctx, gradStops, decoEmoji){
    var g = ctx.createLinearGradient(0, 0, STRIP_W, STRIP_H);
    gradStops.forEach(function(s){ g.addColorStop(s[0], s[1]); });
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, STRIP_W, STRIP_H);

    var footerTop = STRIP_H - FOOTER_H;
    var positions = [
      [34, 140], [STRIP_W - 34, 140], [64, 30], [STRIP_W - 64, 30],
      [34, footerTop + 30], [STRIP_W - 34, footerTop + 30],
      [64, STRIP_H - 20], [STRIP_W - 64, STRIP_H - 20]
    ];
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.font = "24px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    positions.forEach(function(p, idx){ ctx.fillText(decoEmoji[idx % decoEmoji.length], p[0], p[1]); });
    ctx.restore();
  }

  function drawRibbonHeader(ctx, titleText, subtitleText, gradColors){
    try { ctx.drawImage(logoImg, STRIP_W / 2 - 32, 14, 64, 64); } catch(e){}

    var ribbonY = 84, ribbonH = 46, ribbonW = 420;
    var rx = STRIP_W / 2 - ribbonW / 2;
    var g = ctx.createLinearGradient(rx, 0, rx + ribbonW, 0);
    g.addColorStop(0, gradColors[0]);
    g.addColorStop(1, gradColors[1]);
    ctx.save();
    ctx.fillStyle = g;
    ctx.shadowColor = "rgba(0,0,0,.15)";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;
    ctx.beginPath();
    roundRect(ctx, rx, ribbonY, ribbonW, ribbonH, ribbonH / 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 24px 'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
    ctx.fillText(titleText, STRIP_W / 2, ribbonY + ribbonH / 2 + 2);

    ctx.fillStyle = "#2E4A2E";
    ctx.font = "bold 20px 'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
    ctx.fillText(subtitleText, STRIP_W / 2, ribbonY + ribbonH + 28);
  }

  function drawDashedDivider(ctx, topY){
    ctx.save();
    ctx.strokeStyle = "#C8E6C9";
    ctx.lineWidth = 3;
    ctx.setLineDash([2, 10]);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(30, topY + 14);
    ctx.lineTo(STRIP_W - 30, topY + 14);
    ctx.stroke();
    ctx.restore();
  }

  function drawPhotoGrid(ctx, ringColors, dividerEmoji){
    var y = HEADER_H;
    for (var i = 0; i < state.frames.length; i++){
      var xRing = (STRIP_W - (CELL_W + RING * 2)) / 2;
      var xPhoto = xRing + RING;
      var color = ringColors[i % ringColors.length];

      // 컬러 스티커 링 (사진 뒤에 깔리는 알록달록한 테두리)
      ctx.save();
      ctx.fillStyle = color;
      ctx.shadowColor = "rgba(0,0,0,.18)";
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;
      ctx.beginPath();
      roundRect(ctx, xRing, y - RING, CELL_W + RING * 2, CELL_H + RING * 2, 26);
      ctx.fill();
      ctx.restore();

      // 사진
      ctx.save();
      ctx.beginPath();
      roundRect(ctx, xPhoto, y, CELL_W, CELL_H, 18);
      ctx.clip();
      ctx.drawImage(state.frames[i], xPhoto, y, CELL_W, CELL_H);
      ctx.restore();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 5;
      roundRect(ctx, xPhoto, y, CELL_W, CELL_H, 18);
      ctx.stroke();

      // 모서리 반짝이 스티커
      ctx.font = "26px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("✨", xPhoto + CELL_W - 6, y + 4);

      y += CELL_H + GAP;

      // 사진 사이 구분 장식
      if (i < state.frames.length - 1){
        ctx.font = "24px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(dividerEmoji[i % dividerEmoji.length], STRIP_W / 2, y - GAP / 2);
      }
    }
  }

  // drawPhotoGrid의 영상판 - 정지 사진 대신 재생 중인 영상을 각 칸에 그림 (무빙 네컷 합성용)
  function drawVideoGrid(ctx, videos, ringColors, dividerEmoji){
    var y = HEADER_H;
    for (var i = 0; i < videos.length; i++){
      var xRing = (STRIP_W - (CELL_W + RING * 2)) / 2;
      var xPhoto = xRing + RING;
      var color = ringColors[i % ringColors.length];

      ctx.save();
      ctx.fillStyle = color;
      ctx.shadowColor = "rgba(0,0,0,.18)";
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;
      ctx.beginPath();
      roundRect(ctx, xRing, y - RING, CELL_W + RING * 2, CELL_H + RING * 2, 26);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      roundRect(ctx, xPhoto, y, CELL_W, CELL_H, 18);
      ctx.clip();
      drawMirroredCover(ctx, videos[i], videos[i].videoWidth, videos[i].videoHeight, xPhoto, y, CELL_W, CELL_H);
      ctx.restore();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 5;
      roundRect(ctx, xPhoto, y, CELL_W, CELL_H, 18);
      ctx.stroke();

      ctx.font = "26px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("✨", xPhoto + CELL_W - 6, y + 4);

      y += CELL_H + GAP;

      if (i < videos.length - 1){
        ctx.font = "24px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(dividerEmoji[i % dividerEmoji.length], STRIP_W / 2, y - GAP / 2);
      }
    }
  }

  // ===================== 템플릿 1: 20주년 파티 =====================

  function drawAnniversaryFooter(ctx){
    var topY = STRIP_H - FOOTER_H;
    drawDashedDivider(ctx, topY);
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#2E4A2E";
    ctx.font = "bold 24px 'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
    ctx.fillText("🎂 20주년 생일파티 🎂", STRIP_W / 2, topY + 56);
    ctx.fillStyle = "#FF8A65";
    ctx.font = "bold 18px 'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
    ctx.fillText(formatToday(), STRIP_W / 2, topY + 84);
    ctx.fillStyle = "#5a7a5a";
    ctx.font = "14px 'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
    ctx.fillText("우리 함께한 20년, 앞으로도 쭉! 🌱", STRIP_W / 2, topY + 106);
  }

  function composeAnniversaryStrip(ctx){
    drawFestiveBackground(ctx, [[0,"#FFF6DE"],[0.5,"#F5FBEF"],[1,"#E3F5E3"]], ["✨","⭐","🌱","🎈","🎊"]);
    drawRibbonHeader(ctx, "🎉 새싹나라유치원 🎉", "네컷 포토부스", ["#FF8A65","#F48FB1"]);

  // ===================== 템플릿 2: 데일리 =====================

  function drawDailyFooter(ctx){
    var topY = STRIP_H - FOOTER_H;
    drawDashedDivider(ctx, topY);
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";

    if (state.caption){
      ctx.fillStyle = "#2E4A2E";
      ctx.font = "bold 24px 'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
      ctx.fillText(truncateText(ctx, "📍 " + state.caption, STRIP_W - 60), STRIP_W / 2, topY + 56);
    } else {
      ctx.fillStyle = "#2E4A2E";
      ctx.font = "bold 22px 'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
      ctx.fillText("오늘도 즐거운 하루 🌱", STRIP_W / 2, topY + 56);
    }

  }

  function composeDailyStrip(ctx){
    drawFestiveBackground(ctx, [[0,"#E3F6FF"],[0.5,"#F3F0FF"],[1,"#E8FBF3"]], ["🌈","☀️","🍀","💫","🎨"]);
    drawRibbonHeader(ctx, "🌱 새싹나라유치원 🌱", "오늘의 네컷", ["#4FC3F7","#7E57C2"]);
    drawPhotoGrid(ctx, DAILY_COLORS, DAILY_DIVIDER);
    drawDailyFooter(ctx);
  }

  // ===================== 템플릿 3: 낙서 스타일 =====================

  function wobbleEllipse(ctx, cx, cy, rx, ry){
    ctx.beginPath();
    var steps = 14;
    for (var i = 0; i <= steps; i++){
      var t = (i / steps) * Math.PI * 2;
      var jitter = (Math.random() - 0.5) * 4;
      var x = cx + (rx + jitter) * Math.cos(t);
      var y = cy + (ry + jitter) * Math.sin(t);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function drawDoodleCaption(ctx, text, cx, cy, angleDeg, color, fontSize, withCircle){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angleDeg * Math.PI / 180);
    ctx.font = "bold " + fontSize + "px 'Gaegu','Apple SD Gothic Neo',sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    var w = ctx.measureText(text).width;

    if (withCircle){
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      wobbleEllipse(ctx, 0, 0, w / 2 + 22, fontSize / 2 + 16);
      ctx.stroke();
    }

    ctx.fillStyle = color;
    ctx.fillText(text, 0, 0);

    if (!withCircle){
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-w / 2, fontSize * 0.42);
      ctx.quadraticCurveTo(0, fontSize * 0.55, w / 2, fontSize * 0.42);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSketchyFrame(ctx, x, y, w, h){
    ctx.save();
    ctx.strokeStyle = "#2b2b2b";
    ctx.lineWidth = 4;
    ctx.lineJoin = "round";
    for (var k = 0; k < 2; k++){
      ctx.save();
      ctx.translate((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3);
      ctx.beginPath();
      roundRect(ctx, x, y, w, h, 14);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawTape(ctx, cx, cy, w, h, color, angleDeg){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angleDeg * Math.PI / 180);
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = color;
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.restore();
  }

  function drawDoodleBackground(ctx, stripH){
    ctx.fillStyle = "#FFFDF5";
    ctx.fillRect(0, 0, STRIP_W, stripH);

    ctx.save();
    ctx.fillStyle = "#E0DACB";
    ctx.globalAlpha = 0.6;
    for (var yy = 30; yy < stripH; yy += 28){
      for (var xx = 24; xx < STRIP_W; xx += 28){
        ctx.beginPath();
        ctx.arc(xx, yy, 1.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();

    var deco = [["⭐",40,50,-10],["💛",STRIP_W-46,60,12],["✨",STRIP_W-40,stripH-160,15],["🖍️",44,stripH-150,-12]];
    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    deco.forEach(function(d){
      ctx.save();
      ctx.translate(d[1], d[2]);
      ctx.rotate(d[3] * Math.PI / 180);
      ctx.font = "30px sans-serif";
      ctx.fillText(d[0], 0, 0);
      ctx.restore();
    });
    ctx.restore();
  }

  function drawDoodleHeader(ctx){
    try { ctx.drawImage(logoImg, STRIP_W / 2 - 30, 16, 60, 60); } catch(e){}
    drawDoodleCaption(ctx, "새싹나라 왔다감!", STRIP_W / 2, 130, -4, "#1E88E5", 34, false);
    drawDoodleCaption(ctx, "📸 오늘의 낙서 네컷", STRIP_W / 2, 170, 3, "#8E24AA", 18, false);
  }

  function drawDoodlePhotoGrid(ctx, gap){
    var y = HEADER_H;
    var xPhoto = (STRIP_W - CELL_W) / 2;
    for (var i = 0; i < state.frames.length; i++){
      ctx.save();
      ctx.beginPath();
      roundRect(ctx, xPhoto, y, CELL_W, CELL_H, 14);
      ctx.clip();
      ctx.drawImage(state.frames[i], xPhoto, y, CELL_W, CELL_H);
      ctx.restore();

      drawSketchyFrame(ctx, xPhoto, y, CELL_W, CELL_H);
      drawTape(ctx, xPhoto + 70, y, 130, 38, TAPE_COLORS[i % TAPE_COLORS.length], -6);

      y += CELL_H + gap;
    }
  }

  // drawDoodlePhotoGrid의 영상판 (무빙 네컷 합성용)
  function drawDoodleVideoGrid(ctx, videos, gap){
    var y = HEADER_H;
    var xPhoto = (STRIP_W - CELL_W) / 2;
    for (var i = 0; i < videos.length; i++){
      ctx.save();
      ctx.beginPath();
      roundRect(ctx, xPhoto, y, CELL_W, CELL_H, 14);
      ctx.clip();
      drawMirroredCover(ctx, videos[i], videos[i].videoWidth, videos[i].videoHeight, xPhoto, y, CELL_W, CELL_H);
      ctx.restore();

      drawSketchyFrame(ctx, xPhoto, y, CELL_W, CELL_H);
      drawTape(ctx, xPhoto + 70, y, 130, 38, TAPE_COLORS[i % TAPE_COLORS.length], -6);

      y += CELL_H + gap;
    }
  }

  function drawDoodleGapCaptions(ctx, gap){
    var texts = ["넌 누구?", "난 누구?", "완전 신기함 ✨"];
    var colors = ["#E53935", "#1E88E5", "#8E24AA"];
    var angles = [-8, 7, -5];
    var xOffsets = [-14, 18, -12];
    for (var i = 0; i < 3; i++){
      var gapCenterY = HEADER_H + (i + 1) * CELL_H + i * gap + gap / 2;
      drawDoodleCaption(ctx, texts[i], STRIP_W / 2 + xOffsets[i], gapCenterY, angles[i], colors[i], 22, true);
    }
  }

  function drawDoodleFooter(ctx, stripH){
    var topY = stripH - FOOTER_H;
    drawDoodleCaption(ctx, "담에 또 와야지!", STRIP_W / 2, topY + 50, -3, "#E53935", 28, false);
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#555";
    ctx.font = "bold 16px 'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
    ctx.fillText(formatToday(), STRIP_W / 2, topY + 92);
    ctx.fillStyle = "#888";
    ctx.font = "13px 'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
    ctx.fillText("새싹나라유치원", STRIP_W / 2, topY + 114);
  }

  function composeDoodleStrip(ctx, gap, stripH){
    drawDoodleBackground(ctx, stripH);
    drawDoodleHeader(ctx);
    drawDoodlePhotoGrid(ctx, gap);
    drawDoodleGapCaptions(ctx, gap);
    drawDoodleFooter(ctx, stripH);
  }

  // ===================== 컴포지트 진입점 =====================

  function composeStrip(){
    var c = els.stripCanvas;
    var ctx;
    if (state.template === "doodle"){
      var gap = DOODLE_GAP;
      var stripH = HEADER_H + SHOT_COUNT * CELL_H + (SHOT_COUNT - 1) * gap + FOOTER_H;
      c.width = STRIP_W; c.height = stripH;
      ctx = c.getContext("2d");
      composeDoodleStrip(ctx, gap, stripH);
    } else {
      c.width = STRIP_W; c.height = STRIP_H;
      ctx = c.getContext("2d");
      if (state.template === "daily") composeDailyStrip(ctx);
      else composeAnniversaryStrip(ctx);
    }
    return c.toDataURL("image/jpeg", 0.9);
  }

  function renderMovingFrame(ctx, videos, gap, stripH){
    if (state.template === "doodle"){
      drawDoodleBackground(ctx, stripH);
      drawDoodleHeader(ctx);
      drawDoodleVideoGrid(ctx, videos, gap);
      drawDoodleGapCaptions(ctx, gap);
      drawDoodleFooter(ctx, stripH);
    } else if (state.template === "daily"){
      drawFestiveBackground(ctx, [[0,"#E3F6FF"],[0.5,"#F3F0FF"],[1,"#E8FBF3"]], ["🌈","☀️","🍀","💫","🎨"]);
      drawRibbonHeader(ctx, "🌱 새싹나라유치원 🌱", "오늘의 네컷", ["#4FC3F7","#7E57C2"]);
      drawVideoGrid(ctx, videos, DAILY_COLORS, DAILY_DIVIDER);
      drawDailyFooter(ctx);
    } else {
      drawFestiveBackground(ctx, [[0,"#FFF6DE"],[0.5,"#F5FBEF"],[1,"#E3F5E3"]], ["✨","⭐","🌱","🎈","🎊"]);
      drawRibbonHeader(ctx, "🎉 새싹나라유치원 🎉", "네컷 포토부스", ["#FF8A65","#F48FB1"]);
      drawVideoGrid(ctx, videos, ACCENT_COLORS, DIVIDER_EMOJI);
      drawAnniversaryFooter(ctx);
    }
  }

  // 샷마다 따로 녹화해둔 짧은 영상 4개를 각자 자기 칸에서 재생시키면서 그 화면 전체를
  // 다시 녹화해 "네컷 프레임 안에서 움직이는" 무빙 영상을 합성함 (실제 인생네컷 무빙컷과 같은 방식)
  async function buildMovingStrip(){
    if (!state.shotClips || state.shotClips.length < SHOT_COUNT) return null;

    var videos = state.shotClips.map(function(blob){
      var v = document.createElement("video");
      v.src = URL.createObjectURL(blob);
      v.muted = true; v.loop = true; v.playsInline = true;
      return v;
    });

    await Promise.all(videos.map(function(v){
      return new Promise(function(resolve){
        v.oncanplay = resolve;
        v.onerror = resolve; // 재생 준비가 안 돼도 전체 합성은 계속 진행
        v.play().catch(function(){});
      });
    }));

    var gap = state.template === "doodle" ? DOODLE_GAP : GAP;
    var stripH = state.template === "doodle"
      ? HEADER_H + SHOT_COUNT * CELL_H + (SHOT_COUNT - 1) * gap + FOOTER_H
      : STRIP_H;

    var c = els.movingCanvas;
    c.width = STRIP_W; c.height = stripH;
    var ctx = c.getContext("2d");

    var cleanup = function(){
      videos.forEach(function(v){ v.pause(); URL.revokeObjectURL(v.src); });
    };

    var stream;
    try {
      stream = c.captureStream(20);
    } catch(e){
      cleanup();
      return null;
    }

    var mime = pickMimeType();
    var opts = { videoBitsPerSecond: 1500000 };
    if (mime) opts.mimeType = mime;
    var recorder;
    try {
      recorder = new MediaRecorder(stream, opts);
    } catch(e){
      cleanup();
      return null;
    }

    var chunks = [];
    recorder.ondataavailable = function(e){ if (e.data && e.data.size > 0) chunks.push(e.data); };
    var stopped = new Promise(function(resolve){
      recorder.onstop = function(){ resolve(new Blob(chunks, { type: recorder.mimeType || "video/webm" })); };
    });

    recorder.start();

    var drawing = true;
    function frameLoop(){
      if (!drawing) return;
      renderMovingFrame(ctx, videos, gap, stripH);
      requestAnimationFrame(frameLoop);
    }
    frameLoop();

    await sleep(MOVING_CLIP_MS);
    drawing = false;
    recorder.stop();
    var finalBlob = await stopped;

    cleanup();
    return finalBlob;
  }

  function blobToBase64(blob){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onloadend = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function fetchWithTimeout(url, opts, ms){
    return new Promise(function(resolve, reject){
      var settled = false;
      var timer = setTimeout(function(){
        if (settled) return; settled = true; reject(new Error("timeout"));
      }, ms);
      fetch(url, opts).then(function(r){ return r.json(); }).then(function(res){
        if (settled) return; settled = true; clearTimeout(timer); resolve(res);
      }).catch(function(err){
        if (settled) return; settled = true; clearTimeout(timer); reject(err);
      });
    });
  }

  async function uploadSession(photoDataUrl, videoBlob){
    var payload = { photo: photoDataUrl };
    if (videoBlob) payload.video = await blobToBase64(videoBlob);
    return fetchWithTimeout(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) }, 30000);
  }

  function renderQr(url){
    els.qrBox.innerHTML = "";
    var qr = qrcode(0, "M");
    qr.addData(url);
    qr.make();
    els.qrBox.innerHTML = qr.createImgTag(6, 8);
  }

  function armAutoReset(){
    clearTimeout(state.resetTimer);
    state.resetTimer = setTimeout(goStart, AUTO_RESET_MS);
  }

  function waitForReady(){
    els.readyOverlay.classList.remove("hidden");
    return new Promise(function(resolve){ state.readyResolve = resolve; });
  }

  function resolveReady(proceed){
    els.readyOverlay.classList.add("hidden");
    if (state.readyResolve){
      var r = state.readyResolve;
      state.readyResolve = null;
      r(proceed);
    }
  }

  async function goStart(){
    clearTimeout(state.resetTimer);
    state.cancelled = true;
    resolveReady(false);
    stopCamera();
    els.errBox.classList.add("hidden");
    showScreen("screen-start");
  }

  async function startSession(){
    showScreen("screen-camera");
    els.countdownNum.textContent = "";
    els.errBox.classList.add("hidden");
    els.camError.classList.add("hidden");
    try {
      await startCamera();
    } catch(err){
      els.camError.textContent = "카메라를 사용할 수 없어요. 태블릿 카메라 권한을 확인해주세요.";
      els.camError.classList.remove("hidden");
      await sleep(2500);
      goStart();
      return;
    }

    var proceed = await waitForReady();
    if (!proceed || state.cancelled){ stopCamera(); showScreen("screen-start"); return; }

    await runShootingSequence();
    if (state.cancelled){ stopCamera(); showScreen("screen-start"); return; }

    stopCamera();
    showScreen("screen-processing");
    els.processingText.textContent = "사진 만드는 중...";
    var photoDataUrl = composeStrip();
    els.stripPreview.src = photoDataUrl;

    els.processingText.textContent = "영상 합성 중... (각 사진 칸에서 움직이는 영상을 만들고 있어요)";
    var videoBlob = await buildMovingStrip();

    // 업로드 성공 여부와 무관하게 이 기기에서 바로 저장할 수 있도록 로컬에 준비해둠
    state.lastPhotoDataUrl = photoDataUrl;
    if (state.lastVideoObjectUrl) URL.revokeObjectURL(state.lastVideoObjectUrl);
    state.lastVideoObjectUrl = null;
    els.saveVideoBtn.classList.add("hidden");
    if (videoBlob){
      state.lastVideoExt = videoBlob.type.indexOf("mp4") >= 0 ? "mp4" : "webm";
      state.lastVideoObjectUrl = URL.createObjectURL(videoBlob);
      els.saveVideoBtn.classList.remove("hidden");
    }

    els.processingText.textContent = "업로드 중... (와이파이 상태에 따라 시간이 걸릴 수 있어요)";
    try {
      var res = await uploadSession(photoDataUrl, videoBlob);
      if (!res || !res.ok) throw new Error(res && res.error || "upload_failed");
      renderQr(res.viewUrl);
      showScreen("screen-result");
      armAutoReset();
    } catch(err){
      showScreen("screen-result");
      els.qrBox.innerHTML = "";
      els.errBox.textContent = "업로드에 실패했어요. 와이파이를 확인하고 다시 시도해주세요. (이 기기에는 저장할 수 있어요)";
      els.errBox.classList.remove("hidden");
      armAutoReset();
    }
  }

  function saveLocally(href, filename){
    var a = document.createElement("a");
    a.href = href;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  document.querySelectorAll(".template-card").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.template = btn.dataset.template;
      if (state.template === "daily"){
        els.captionInput.value = "";
        showScreen("screen-caption");
        setTimeout(function(){ els.captionInput.focus(); }, 200);
      } else {
        state.caption = "";
        startSession();
      }
    });
  });

  els.captionBackBtn.addEventListener("click", function(){ showScreen("screen-start"); });
  els.captionStartBtn.addEventListener("click", function(){
    state.caption = els.captionInput.value.trim();
    startSession();
  });

  els.resetBtn.addEventListener("click", goStart);
  els.cancelBtn.addEventListener("click", goStart);
  els.readyStartBtn.addEventListener("click", function(){ resolveReady(true); });
  els.flipBtn.addEventListener("click", async function(){
    state.facingMode = state.facingMode === "user" ? "environment" : "user";
    stopCamera();
    try { await startCamera(); } catch(e){}
  });

  els.savePhotoBtn.addEventListener("click", function(){
    if (state.lastPhotoDataUrl) saveLocally(state.lastPhotoDataUrl, "새싹나라_네컷.jpg");
  });
  els.saveVideoBtn.addEventListener("click", function(){
    if (state.lastVideoObjectUrl) saveLocally(state.lastVideoObjectUrl, "새싹나라_영상." + state.lastVideoExt);
  });

  ["click","touchstart"].forEach(function(evt){
    document.getElementById("screen-result").addEventListener(evt, armAutoReset);
  });

})();
</script>
</body>
</html>
